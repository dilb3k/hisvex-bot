# The bot used to be a Worker on the starter plan, which is what the $7/month
# invoice was for — a long-polling process is never woken by HTTP, so Render's
# free tier (web services only) could not run it.
#
# It runs in webhook mode now: Telegram POSTs each update, which makes it an
# ordinary web service and therefore free. The trade-off is that a free web
# service sleeps after 15 minutes idle, so the first message after a quiet
# spell waits for a cold start, and the reminder cron only fires while the
# service happens to be awake. Moving to the starter plan removes both.
services:
  - type: web
    name: hisvex-bot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_APPROVAL_CHAT_ID
        sync: false
      - key: BOT_INTERNAL_SECRET
        sync: false
      - key: CARD_NUMBER
        sync: false
      - key: CARD_HOLDER_NAME
        sync: false
      # Must be this service's own public URL. Unset it to fall back to long
      # polling, which is what local development uses.
      - key: WEBHOOK_URL
        value: https://hisvex-bot.onrender.com
      - key: BACKEND_URL
        value: https://hisvex-api-production.up.railway.app
      - key: APP_DOWNLOAD_URL
        value: https://hisvex-web.vercel.app
      - key: SUPPORT_TELEGRAM_USERNAME
        value: dilbek7011
      - key: REMINDER_DAYS_BEFORE
        value: "3"
